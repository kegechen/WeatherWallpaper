name: release

# 发布 GitHub Release（tag 形如 v1.2.3）时构建 MSI 安装包 + 便携版 zip 并上传到该 Release。
# 也可以手动触发（workflow_dispatch）做一次试构建，产物作为 workflow artifact 下载。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'version, e.g. 0.1.0'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ inputs.version }}' }
          $v = $v.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe + MSI
        shell: pwsh
        run: ./build.ps1 -Version '${{ steps.ver.outputs.version }}' -Msi

      - uses: actions/upload-artifact@v4
        with:
          name: WeatherWallpaper-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Upload to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' (Get-ChildItem dist/*).FullName --clobber
