<!doctype html>
<meta charset="utf-8">
<body style="background:#234;color:#fff;font:20px sans-serif">
<pre id="out"></pre>
<script>
const lines = [];
const log = s => { lines.push(s); console.log(s); };
for (const kind of ['webgl2', 'webgl']) {
  const c = document.createElement('canvas');
  const gl = c.getContext(kind);
  if (!gl) { log(kind + ': 不可用'); continue; }
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  log(kind + ': ' + (ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) + ' | ' + gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)
                          : gl.getParameter(gl.RENDERER)));
}
// 粗测 Canvas 2D：画 2000 个半透明圆 60 帧的耗时
const c2 = document.createElement('canvas'); c2.width = 1920; c2.height = 1280;
const g = c2.getContext('2d');
const t0 = performance.now();
for (let f = 0; f < 60; f++) {
  g.fillStyle = '#123'; g.fillRect(0, 0, 1920, 1280);
  for (let i = 0; i < 2000; i++) { g.fillStyle = 'rgba(200,220,255,0.3)'; g.beginPath(); g.arc((i * 97 + f * 13) % 1920, (i * 53) % 1280, 12, 0, 6.283); g.fill(); }
  g.getImageData(0, 0, 1, 1);
}
log('canvas2d 60 帧 x 2000 圆：' + (performance.now() - t0).toFixed(0) + ' ms');
log('UA: ' + navigator.userAgent);
document.getElementById('out').textContent = lines.join('\n');
console.log('PROBE_DONE');
</script>
